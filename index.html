<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock - Paper - Scissors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.1/css/bulma.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+AU+VIC:wght@100..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <section class="play-view-section flex-center">
        <h1>Rock - Paper - Scissors</h1>
        <h2>Hola</h2>
        <button id="startGame">Play</button>
      </section>
      <section class="score-section">
        <article class="score-player text-center">
          <h2>Player</h2>
          <span>1</span>
        </article>
        <article class="announce-round">
          <h3>Ganaste!!!</h3>
        </article>
        <article class="score-computer text-center">
          <h2>Computer</h2>
          <span>2</span>
        </article>
      </section>
      <section class="selected-options-section">
        <article class="player-option text-center">
          <img class="img-player-option" src="img/piedra.png" alt="rock" width="200px" height="200px" />
          <h3>Piedra</h3>
        </article>
        <article class="img-versus">
          <img src="img/contra.png" alt="Imagen versus" />
        </article>
        <article class="computer-option text-center">
          <img class="img-computer-option" src="img/papel.png" alt="rock" width="200px" height="200px" />
          <h3>Papel</h3>
        </article>
      </section>
      <section class="button-options-section">
        <article class="rock-option">
          <button class="rock-button">
            <img src="img/button-piedra.png" alt="imagen de botón de piedra" />
          </button>
          <span
            >Presionar <br />
            J</span
          >
        </article>
        <article class="paper-option">
          <button class="paper-button">
            <img src="img/button-papel.png" alt="imagen de botón de papel" />
          </button>
          <span
            >Presionar <br />
            K</span
          >
        </article>
        <article class="scissors-option">
          <button class="scissors-button">
            <img src="img/button-tijera.png" alt="imagen de botón de tijera" />
          </button>
          <span
            >Presionar <br />
            L
          </span>
        </article>
      </section>
      <button class="js-modal-trigger" data-target="modal-js-example">Open JS example modal</button>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal-js-example">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Resultados</p>
          <button class="delete" aria-label="close"></button>
        </header>
        <section class="modal-card-body">
          <p class="announce-result">
            Felicidades, ganaste el juego!!!
            <br />
            ♥♥♥
          </p>
        </section>
        <footer class="modal-card-foot">
          <div class="buttons">
            <button class="button is-success btn-play-again">
              <img class="img-play-again" src="img/play-again.png" alt="Icono de jugar otra vez" />
            </button>
            <button class="button btn-exit-game">
              <img class="img-exit-game" src="img/salir.png" alt="Icono de salir del juego" />
            </button>
          </div>
        </footer>
      </div>
    </div>

    <!-- Scripts -->
    <script src="script.js" defer></script>
  </body>
</html>
